name: Sync bracket scores

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bracket
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the bracket
        run: node scripts/sync-bracket.mjs
      - name: Commit new scores
        run: |
          if git diff --quiet -- data/live.json && git ls-files --error-unmatch data/live.json >/dev/null 2>&1; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "New bracket scores"
          git push
